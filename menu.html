<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Sri Satya Sai Menu</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #fafafa; }
    h1 { color: maroon; }
    .menu-section { margin: 20px auto; max-width: 600px; }
    .item { border-bottom: 1px solid #ddd; padding: 10px 0; }
    .price { float: right; color: green; }
  </style>
</head>
<body>
  <h1>Hotel Sri Satya Sai Menu</h1>
  
  <div class="menu-section">
    <h2>Breakfast</h2>
    <div class="item">Idly <span class="price">₹40</span></div>
    <div class="item">Dosa <span class="price">₹60</span></div>
    <div class="item">Vada <span class="price">₹45</span></div>
  </div>

  <div class="menu-section">
    <h2>Lunch</h2>
    <div class="item">Veg Thali <span class="price">₹120</span></div>
    <div class="item">Biryani <span class="price">₹150</span></div>
  </div>

  <div class="menu-section">
    <h2>Dinner</h2>
    <div class="item">Chapati & Curry <span class="price">₹100</span></div>
  </div>

</body>
</html>
