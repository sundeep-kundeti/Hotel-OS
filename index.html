<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ALT – QR Booking</title>
  <!-- Tailwind via CDN (fine for a simple page) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React + ReactDOM + Babel (so we can keep JSX in one file) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useMemo, useState } = React;

    const CONFIG = {
      hotelName: "ALT Pods — Hotel Sri Sathya Sai",
      currency: "INR",
      taxesPct: 12,
      upi: {
        vpa: "srimunihotelsandhospitalityservicesprivatelimited.ibz@icici",   // <-- CHANGE THIS
        payeeName: "srimunihotelsandhospitalityservicesprivatelimited",
        enabled: true,
      },
      roomTypes: [
        { id: "freshup", name: "Fresh-up Pod", base: 300, perHour: 200 },
        { id: "standard", name: "Standard Room", base: 800, perHour: 400 },
        { id: "deluxe", name: "Deluxe Room", base: 1200, perHour: 500 },
      ],
      allowedHours: [1, 2, 3, 6, 12, 24],
      priceCap: null, // e.g., 1600 or null
    };

    function currencyFormat(n, currency = CONFIG.currency) {
      try { return new Intl.NumberFormat("en-IN", { style: "currency", currency }).format(n); }
      catch { return `${currency} ${n.toFixed(2)}`; }
    }

    function computePrice(room, hours) {
      const base = Number(room.base) || 0;
      const perHour = Number(room.perHour) || 0;
      const h = Math.max(1, Number(hours) || 1);
      let subtotal = base + perHour * (h - 1);
      if (CONFIG.priceCap) subtotal = Math.min(subtotal, CONFIG.priceCap);
      const tax = CONFIG.taxesPct ? (subtotal * CONFIG.taxesPct) / 100 : 0;
      const total = Math.round((subtotal + tax) * 100) / 100;
      return { subtotal, tax, total };
    }

    function makeUPILink({ amount, note, vpa, payeeName }) {
      const params = new URLSearchParams({
        pa: vpa,
        pn: payeeName || CONFIG.hotelName,
        am: amount.toFixed(2),
        cu: "INR",
        tn: note,
        tr: `ALT-${Date.now()}`,
      });
      return `upi://pay?${params.toString()}`;
    }

    function QRBooking() {
      const [selectedRoomId, setSelectedRoomId] = useState(CONFIG.roomTypes[0].id);
      const [hours, setHours] = useState(CONFIG.allowedHours[0]);
      const [guestName, setGuestName] = useState("");
      const [phone, setPhone] = useState("");

      const room = useMemo(() => CONFIG.roomTypes.find(r => r.id === selectedRoomId), [selectedRoomId]);
      const price = useMemo(() => computePrice(room, hours), [room, hours]);

      function onPay() {
        if (!CONFIG.upi.enabled) { alert("Payment not enabled."); return; }
        if (!CONFIG.upi.vpa) { alert("Missing UPI VPA"); return; }
        const note = `${CONFIG.hotelName} · ${room.name} · ${hours}hr${hours > 1 ? "s" : ""}`;
        const link = makeUPILink({ amount: price.total, note, vpa: CONFIG.upi.vpa, payeeName: CONFIG.upi.payeeName });
        window.location.href = link;
        try {
          localStorage.setItem("qr-booking-latest",
            JSON.stringify({ guestName, phone, room: room.name, hours, total: price.total, ts: Date.now() })
          );
        } catch {}
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 flex items-center justify-center p-4">
          <div className="w-full max-w-lg bg-white rounded-2xl shadow-xl p-5 sm:p-8">
            <header className="mb-6 text-center">
              <h1 className="text-2xl font-bold tracking-tight">{CONFIG.hotelName}</h1>
              <p className="text-sm text-gray-600">Scan → Select → Pay (UPI)</p>
            </header>

            <div className="space-y-5">
              <div>
                <label className="block text-sm font-medium mb-2">Room type</label>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  {CONFIG.roomTypes.map(r => (
                    <button key={r.id}
                      onClick={() => setSelectedRoomId(r.id)}
                      className={`border rounded-xl px-3 py-3 text-left transition focus:outline-none focus:ring-2 focus:ring-indigo-500 ${selectedRoomId === r.id ? "border-indigo-500 ring-1 ring-indigo-500" : "border-gray-200"}`}>
                      <div className="font-semibold">{r.name}</div>
                      <div className="text-xs text-gray-500">
                        Base {currencyFormat(r.base)} + {currencyFormat(r.perHour)}/hr
                      </div>
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-sm font-medium mb-2">Duration</label>
                <div className="flex flex-wrap gap-2">
                  {CONFIG.allowedHours.map(h => (
                    <button key={h} onClick={() => setHours(h)}
                      className={`px-4 py-2 rounded-full border transition focus:outline-none focus:ring-2 focus:ring-indigo-500 ${hours === h ? "border-indigo-500 ring-1 ring-indigo-500" : "border-gray-200"}`}>
                      {h} hr{h > 1 ? "s" : ""}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-sm font-medium mb-1">Your name (optional)</label>
                  <input value={guestName} onChange={e => setGuestName(e.target.value)}
                    className="w-full rounded-xl border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="e.g., Kishan R." />
                </div>
                <div>
                  <label className="block text-sm font-medium mb-1">Phone (optional)</label>
                  <input value={phone} onChange={e => setPhone(e.target.value)} inputMode="tel"
                    className="w-full rounded-xl border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="e.g., 9xxxxxxxxx" />
                </div>
              </div>

              <div className="bg-gray-50 rounded-2xl border border-gray-200 p-4">
                <div className="flex items-center justify-between text-sm">
                  <span>Subtotal</span><span>{currencyFormat(price.subtotal)}</span>
                </div>
                <div className="flex items-center justify-between text-sm mt-1">
                  <span>Tax ({CONFIG.taxesPct}%)</span><span>{currencyFormat(price.tax)}</span>
                </div>
                <div className="border-t mt-3 pt-3 flex items-center justify-between font-semibold">
                  <span>Total</span><span className="text-lg">{currencyFormat(price.total)}</span>
                </div>
                {CONFIG.priceCap && <div className="mt-2 text-xs text-gray-500">(Capped at {currencyFormat(CONFIG.priceCap)})</div>}
              </div>

              <button onClick={onPay}
                className="w-full py-3 rounded-2xl bg-indigo-600 text-white font-semibold shadow hover:bg-indigo-700 active:bg-indigo-800 focus:outline-none focus:ring-4 focus:ring-indigo-300">
                Proceed to Payment (UPI)
              </button>

              <ul className="text-xs text-gray-500 list-disc pl-5 space-y-1">
                <li>UPI opens in your payment app (on mobile). On desktop, copy the link to your phone.</li>
                <li>Show the paid screen at the desk to receive room keys.</li>
                <li>If UPI fails, pay at desk — your selection is saved for faster check-in.</li>
              </ul>
            </div>

            <footer className="mt-6 text-center text-xs text-gray-400">© {new Date().getFullYear()} {CONFIG.hotelName}</footer>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<QRBooking />);
  </script>
</body>
</html>
